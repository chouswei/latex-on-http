[package]
name = "endleaf-pdfcheck"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
resolver = "3"
license = "AGPL-3.0-or-later"
description = "Endleaf PDF layout checker (ENDLEAF-R81 checks, Rust implementation per ENDLEAF-R82)"
publish = false

[[bin]]
name = "endleaf-pdfcheck"
path = "src/main.rs"

[dependencies]
miniz_oxide = "0.8"
unicode-normalization = "0.1"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
