name: docker-hub-publish
# This fork does not publish images and does not deploy anywhere.
# The upstream Docker Hub push has been removed.
on:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pipx
          pipx install uv
          make install
      - name: Unit tests
        run: make test
